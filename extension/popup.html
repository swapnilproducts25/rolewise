<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --ink: #14223b; --muted: #5b6880; --line: #e4e9f1; --navy: #1d3461; --soft: #f4f6fa; }
  body { width: 330px; margin: 0; font: 13px/1.35 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); }
  header { display: flex; align-items: center; gap: 6px; padding: 10px 12px; background: var(--navy); color: #fff; }
  header b { flex: 1; font-size: 14px; letter-spacing: .02em; }
  header button { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 6px;
                  font-size: 12px; padding: 4px 9px; cursor: pointer; }
  header button:hover { background: rgba(255,255,255,.14); }
  main { padding: 4px 12px 12px; }
  h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 12px 0 2px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 7px 4px; border-bottom: 1px solid var(--line); border-radius: 6px; }
  .row:hover { background: var(--soft); }
  .job { flex: 1; min-width: 0; cursor: pointer; }
  .co { font-weight: 600; }
  .role { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { display: inline-block; margin-left: 4px; font-size: 10px; font-weight: 600; color: var(--navy); background: #e8eef8;
         border-radius: 4px; padding: 1px 5px; vertical-align: 1px; }
  .fit { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--soft); border-radius: 10px; padding: 2px 7px; }
  .age { font-size: 10px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .age.new { color: #fff; background: #1f8a5b; border-radius: 4px; padding: 1px 5px; }
  .age.old { color: #a0aabb; }
  details.older summary { cursor: pointer; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em;
                          color: var(--muted); margin: 14px 0 2px; }
  .x { border: 0; background: none; color: #a0aabb; font-size: 15px; line-height: 1; cursor: pointer; padding: 2px 4px; }
  .x:hover { color: #b3261e; }
  .note { color: var(--muted); padding: 8px 4px 0; }
  .paused { background: #fff6e5; color: #7a4b00; border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
  .act { border: 1px solid var(--navy); background: #fff; color: var(--navy); border-radius: 6px; font-size: 11px; padding: 3px 8px; cursor: pointer; }
  .deb { padding: 0 4px 8px; }
  .deb textarea { width: 100%; box-sizing: border-box; font: 13px/1.4 -apple-system, "Segoe UI", Arial, sans-serif;
                  border: 1px solid #c9d4e8; border-radius: 6px; padding: 6px; }
  .deb .save { margin-top: 4px; background: var(--navy); color: #fff; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  .msg { color: var(--muted); font-size: 12px; }
  .done-tag { font-size: 11px; font-weight: 600; color: #1f8a5b; }
  .act.quiet { border-color: #c9d4e8; color: var(--muted); padding: 1px 7px; }
</style>
</head>
<body>
<header><b>Rolewise</b>
  <button id="fillpage" title="Fill the application form open in this tab (Alt+Shift+F)">Fill page</button>
  <button id="pause" hidden></button></header>
<main id="list"><p class="note">Loading…</p></main>
<script src="popup.js"></script>
</body>
</html>
