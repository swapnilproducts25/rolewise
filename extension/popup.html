<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; font: 14px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #14223b; }
  header { background: #1d3461; color: #fff; padding: 10px 14px; font-weight: 700; }
  header span { font-weight: 400; color: #c9d4e8; font-size: 12px; display: block; }
  main { padding: 6px 14px 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: #5b6880; margin: 12px 0 4px; }
  a.job { display: block; padding: 8px 10px; margin-top: 6px; border: 1px solid #dde3ec; border-radius: 8px;
          color: #1d3461; font-weight: 600; text-decoration: none; cursor: pointer; }
  a.job:hover { background: #eef2f8; }
  .fit { color: #5b6880; font-weight: 400; font-size: 12px; }
  .muted { color: #5b6880; font-size: 13px; }
  .row { position: relative; }
  .row a.job { padding-right: 92px; }
  button.done { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 1px solid #dde3ec;
                background: #fff; color: #5b6880; border-radius: 6px; font-size: 11px; padding: 3px 6px; cursor: pointer; }
  button.done:hover { color: #1d3461; border-color: #1d3461; }
  .soon { padding: 4px 0; color: #5b6880; font-size: 13px; }
</style>
</head>
<body>
<header>Rolewise Fill<span>Click a job: the form opens and fills itself. You check it and click Submit.</span></header>
<main id="list"><p class="muted">Loading…</p></main>
<script src="popup.js"></script>
</body>
</html>
